services:
  postgres:
    image: postgres:16-alpine
    container_name: animalopolis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: animalopolis
      POSTGRES_PASSWORD: animalopolis
      POSTGRES_DB: animalopolis
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U animalopolis -d animalopolis"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: animalopolis-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: animalopolis-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      (mc mb local/animalopolis-examenes --ignore-existing) &&
      mc anonymous set none local/animalopolis-examenes &&
      echo 'MinIO bucket ready (private)'
      "

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: animalopolis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-secret-change-me-please-make-this-long}
      DATABASE_URL: postgresql+psycopg://animalopolis:animalopolis@postgres:5432/animalopolis
      CORS_ORIGINS: http://localhost:5173
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: animalopolis-examenes
      S3_USE_PATH_STYLE: "true"
      S3_PRESIGNED_EXPIRES_SECONDS: "300"
      WHATSAPP_SERVICE_API_KEY: ${WHATSAPP_SERVICE_API_KEY:-dev-api-key-change-me}
      BOOTSTRAP_ADMIN_EMAIL: admin@animalopolis.app
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMeNow!2026
      BOOTSTRAP_ADMIN_NOMBRE: Administrador
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres-data:
  minio-data:
